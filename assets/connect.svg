<g class="conn-a" style="animation-name:conn-slideL;animation-delay:0.76s">
<rect x="484" y="320" width="362" height="78" rx="18" fill="#1b2a4a" fill-opacity=".07" filter="url(#conn-soft)"/><rect x="482" y="312" width="366" height="78" rx="18" fill="#ffffff" stroke="url(#conn-cardhair)" stroke-width="1.2" />
<rect x="502" y="330.0" width="42" height="42" rx="12" fill="#247bff"/><circle fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" cx="523" cy="351.0" r="7"/><ellipse fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" cx="523" cy="351.0" rx="3" ry="7"/><path fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M516 351.0h14"/>
<text x="560" y="347" class="conn-m conn-b" font-size="16" fill="#0b1222" >Portfolio</text>
<text x="560" y="368" class="conn-m" font-size="13" fill="#4a5468" >vishwajeet.me</text>
<g class="conn-nudge" style="animation-delay:1.78s"><path d="M808 351.0h16m-6-6 6 6-6 6" fill="none" stroke="#ff354f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="conn-a" style="animation-name:conn-fadeIn;animation-delay:1.44s"><g class="conn-nudge" style="animation-delay:1.48s"><path d="M444 345.0l6 6-6 6M454 345.0l6 6-6 6" fill="none" stroke="#247bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
