<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img" aria-labelledby="conn-title conn-desc">
<title id="conn-title">Connect with Vishwajeet</title>
<desc id="conn-desc">A terminal running connect.sh beside two cards: LinkedIn (/in/vishwajeetsage) and portfolio (vishwajeet.me). Clickable links are below the image.</desc>
<!-- Fonts: Anton, Copyright 2020 The Anton Project Authors (https://github.com/googlefonts/AntonFont.git); JetBrains Mono, Copyright 2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono). Both subset and embedded under the SIL Open Font License 1.1, see licenses/ next to this file. -->
<style>@font-face{font-family:'connDisplay';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'connMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'connMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal;font-display:block}
.conn-d{font-family:'connDisplay',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;font-weight:400}
.conn-m{font-family:'connMono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.conn-b{font-weight:700}
.conn-a{animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.75,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:50% 50%}
.conn-still{display:none}
@keyframes conn-fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes conn-fadeIn{from{opacity:0}to{opacity:1}}
@keyframes conn-slideR{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes conn-slideL{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes conn-pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes conn-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

.conn-caret{animation:conn-blink 1.05s linear infinite}
.conn-nudge{animation:conn-nudge 1.7s ease-in-out infinite both}
@keyframes conn-nudge{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(6px);opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .conn-smil{display:none}
  .conn-still{display:inline}
}</style>
<defs>
<linearGradient id="conn-hair" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#247bff" stop-opacity=".85"/>
  <stop offset=".38" stop-color="#247bff" stop-opacity=".16"/>
  <stop offset=".62" stop-color="#ff354f" stop-opacity=".16"/>
  <stop offset="1" stop-color="#ff354f" stop-opacity=".8"/>
</linearGradient>
<linearGradient id="conn-cardhair" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0b1222" stop-opacity=".10"/>
  <stop offset=".5" stop-color="#247bff" stop-opacity=".30"/>
  <stop offset="1" stop-color="#ff354f" stop-opacity=".34"/>
</linearGradient>
<pattern id="conn-dots" width="18" height="18" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.05" fill="#0b1222" fill-opacity=".07"/>
</pattern>
<radialGradient id="conn-glowB"><stop offset="0" stop-color="#247bff" stop-opacity=".16"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
<radialGradient id="conn-glowR"><stop offset="0" stop-color="#ff354f" stop-opacity=".12"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
<filter id="conn-soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="conn-frame"><rect x="1" y="1" width="898" height="450" rx="28"/></clipPath></defs>
<rect x="1" y="1" width="898" height="450" rx="28" fill="#f8fafd"/>
<g clip-path="url(#conn-frame)">
  <circle cx="150" cy="380" r="300" fill="url(#conn-glowB)"/><circle cx="780" cy="110" r="300" fill="url(#conn-glowR)"/>
  <rect width="900" height="452" fill="url(#conn-dots)"/>
</g>
<rect x=".75" y=".75" width="898.5" height="450.5" rx="28" fill="none" stroke="url(#conn-hair)" stroke-width="1.5"/>
<g class="conn-a" style="animation-name:conn-fadeUp;animation-delay:.05s">
<rect x="52" y="49" width="22" height="3" rx="1.5" fill="#ff354f"/>
<text x="84" y="56" class="conn-m conn-b" font-size="13" letter-spacing="2.2" fill="#1a5fd6" >03 / CONNECT</text>
</g>
<g class="conn-a" style="animation-name:conn-fadeUp;animation-delay:.15s">
<text x="50" y="126" class="conn-d" font-size="58" letter-spacing="0.5" fill="#0b1222" >LET&#x27;S CONNECT</text>
</g>
<g class="conn-a" style="animation-name:conn-fadeUp;animation-delay:.28s">
<text x="52" y="158" class="conn-m" font-size="15" fill="#4a5468" >Clickable links are right below this card ↓</text>
</g>
<g class="conn-a" style="animation-name:conn-slideR;animation-delay:0.35s;animation-duration:0.9s">
<rect x="54" y="204" width="368" height="212" rx="16" fill="#1b2a4a" fill-opacity=".07" filter="url(#conn-soft)"/><rect x="52" y="196" width="372" height="212" rx="16" fill="#ffffff" stroke="url(#conn-cardhair)" stroke-width="1.2" />
<rect x="53" y="232" width="370" height="1" fill="#e2e7f1"/>
<circle cx="72" cy="214" r="5" fill="#ff354f"/>
<circle cx="88" cy="214" r="5" fill="#ffb547"/>
<circle cx="104" cy="214" r="5" fill="#247bff"/>
<text x="262" y="219" class="conn-m" font-size="12" fill="#7c869b" text-anchor="middle" >connect.sh</text>
<g class="conn-a" style="animation-name:conn-fadeIn;animation-delay:0.90s;animation-duration:0.4s"><text x="72" y="262" class="conn-m" font-size="13" xml:space="preserve" ><tspan fill="#d91a3a" class="conn-b">$ </tspan><tspan fill="#0b1222" class="conn-b">./connect.sh --with vishwajeet</tspan></text></g>
<g class="conn-a" style="animation-name:conn-fadeIn;animation-delay:1.12s;animation-duration:0.4s"><text x="72" y="287" class="conn-m" font-size="13" xml:space="preserve" ><tspan fill="#7c869b">› </tspan><tspan fill="#4a5468">resolving channels…</tspan></text></g>
<g class="conn-a" style="animation-name:conn-fadeIn;animation-delay:1.34s;animation-duration:0.4s"><text x="72" y="312" class="conn-m" font-size="13" xml:space="preserve" ><tspan fill="#247bff" class="conn-b">● </tspan><tspan fill="#1a5fd6">linkedin    </tspan><tspan fill="#0b1222">/in/vishwajeetsage</tspan></text></g>
<g class="conn-a" style="animation-name:conn-fadeIn;animation-delay:1.56s;animation-duration:0.4s"><text x="72" y="337" class="conn-m" font-size="13" xml:space="preserve" ><tspan fill="#247bff" class="conn-b">● </tspan><tspan fill="#1a5fd6">portfolio   </tspan><tspan fill="#0b1222">vishwajeet.me</tspan></text></g>
<g class="conn-a" style="animation-name:conn-fadeIn;animation-delay:1.78s;animation-duration:0.4s"><text x="72" y="362" class="conn-m" font-size="13" xml:space="preserve" ><tspan fill="#7c869b">› </tspan><tspan fill="#4a5468">2 channels open. links below ↓</tspan></text></g>
<g class="conn-a" style="animation-name:conn-fadeIn;animation-delay:2.00s;animation-duration:0.4s"><text x="72" y="387" class="conn-m" font-size="13" xml:space="preserve" ><tspan fill="#d91a3a" class="conn-b">$ </tspan></text><rect x="89.6" y="375" width="8" height="15" fill="#0b1222" class="conn-caret"/></g>
</g>
<g class="conn-a" style="animation-name:conn-slideL;animation-delay:0.60s">
<rect x="484" y="222" width="362" height="78" rx="18" fill="#1b2a4a" fill-opacity=".07" filter="url(#conn-soft)"/><rect x="482" y="214" width="366" height="78" rx="18" fill="#ffffff" stroke="url(#conn-cardhair)" stroke-width="1.2" />
<g transform="translate(501.82 231.82) scale(1.06)"><path fill="#0A66C2" d="M34.5,3H5.6C4.2,3,3,4.1,3,5.4v29.1C3,35.9,4.2,37,5.6,37h29C35.9,37,37,35.9,37,34.6V5.4C37,4.1,35.9,3,34.5,3z"/><path fill="#FFFFFF" d="M8,16h5v16H8V16z"/><path fill="#FFFFFF" d="M16,16h4.8v2.4c0.6-1.3,2.5-2.6,4.9-2.6c4.7,0,6.3,2.1,6.3,7.2V32h-5v-8c0-2.7-0.5-4.1-2.5-4.1c-2.6,0-3.5,2-3.5,4.1V32h-5V16z"/><circle fill="#FFFFFF" cx="10.5" cy="10.5" r="3.05"/></g>
<text x="560" y="249" class="conn-m conn-b" font-size="16" fill="#0b1222" >LinkedIn</text>
<text x="560" y="270" class="conn-m" font-size="13" fill="#4a5468" >/in/vishwajeetsage</text>
<g class="conn-nudge" style="animation-delay:1.60s"><path d="M808 253.0h16m-6-6 6 6-6 6" fill="none" stroke="#ff354f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
