<path fill="none" stroke="#d91a3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M742 207a10.5 10.5 0 1 0 .8 6.5"/><path fill="none" stroke="#d91a3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M743.5 200v7.5h-7.5"/>
<text x="830" y="220" class="about-d" font-size="22" fill="#d91a3a" text-anchor="end" >20%</text>
<text x="711" y="282" class="about-d" font-size="30" letter-spacing="0.5" fill="#0b1222" >SCRUM</text>
