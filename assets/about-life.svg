<g class="about-a" style="animation-name:about-fadeUp;animation-delay:0.50s"><rect x="694" y="172" width="152" height="208" rx="20" fill="#1b2a4a" fill-opacity=".07" filter="url(#about-soft)"/><rect x="692" y="164" width="156" height="208" rx="20" fill="#ffffff" stroke="url(#about-cardhair)" stroke-width="1.2" />
<rect x="692" y="190" width="4" height="156" rx="2" fill="#ff354f" class="about-a" style="animation-name:about-grow;animation-delay:0.95s;animation-duration:0.9s"/>
