<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="about-title about-desc">
<title id="about-title">What I do</title>
<desc id="about-desc">Two roles: Backend Developer (Java, Spring Boot, REST APIs) and Scrum Master.</desc>
<!-- Fonts: Anton, Copyright 2020 The Anton Project Authors (https://github.com/googlefonts/AntonFont.git); JetBrains Mono, Copyright 2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono). Both subset and embedded under the SIL Open Font License 1.1, see licenses/ next to this file. -->
<style>@font-face{font-family:'aboutDisplay';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'aboutMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'aboutMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal;font-display:block}
.about-d{font-family:'aboutDisplay',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;font-weight:400}
.about-m{font-family:'aboutMono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.about-b{font-weight:700}
.about-a{animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.75,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:50% 50%}
.about-still{display:none}
@keyframes about-fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes about-fadeIn{from{opacity:0}to{opacity:1}}
@keyframes about-slideR{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes about-slideL{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes about-pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes about-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .about-smil{display:none}
  .about-still{display:inline}
}</style>
<defs>
<linearGradient id="about-hair" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#247bff" stop-opacity=".85"/>
  <stop offset=".38" stop-color="#247bff" stop-opacity=".16"/>
  <stop offset=".62" stop-color="#ff354f" stop-opacity=".16"/>
  <stop offset="1" stop-color="#ff354f" stop-opacity=".8"/>
</linearGradient>
<linearGradient id="about-cardhair" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0b1222" stop-opacity=".10"/>
  <stop offset=".5" stop-color="#247bff" stop-opacity=".30"/>
  <stop offset="1" stop-color="#ff354f" stop-opacity=".34"/>
</linearGradient>
<pattern id="about-dots" width="18" height="18" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.05" fill="#0b1222" fill-opacity=".07"/>
</pattern>
<radialGradient id="about-glowB"><stop offset="0" stop-color="#247bff" stop-opacity=".16"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
<radialGradient id="about-glowR"><stop offset="0" stop-color="#ff354f" stop-opacity=".12"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
<filter id="about-soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="about-frame"><rect x="1" y="1" width="898" height="358" rx="28"/></clipPath>
<linearGradient id="about-tileB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff" stop-opacity=".16"/><stop offset="1" stop-color="#247bff" stop-opacity=".06"/></linearGradient>
<linearGradient id="about-tileR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff354f" stop-opacity=".16"/><stop offset="1" stop-color="#ff354f" stop-opacity=".06"/></linearGradient></defs>
<rect x="1" y="1" width="898" height="358" rx="28" fill="#f8fafd"/>
<g clip-path="url(#about-frame)">
  <circle cx="120" cy="70" r="300" fill="url(#about-glowB)"/><circle cx="800" cy="330" r="300" fill="url(#about-glowR)"/>
  <rect width="900" height="360" fill="url(#about-dots)"/>
</g>
<rect x=".75" y=".75" width="898.5" height="358.5" rx="28" fill="none" stroke="url(#about-hair)" stroke-width="1.5"/>
<g class="about-a" style="animation-name:about-fadeUp;animation-delay:.05s">
<rect x="52" y="49" width="22" height="3" rx="1.5" fill="#ff354f"/>
<text x="84" y="56" class="about-m about-b" font-size="13" letter-spacing="2.2" fill="#1a5fd6" >01 / ABOUT</text>
</g>
<g class="about-a" style="animation-name:about-fadeUp;animation-delay:.15s">
<text x="50" y="126" class="about-d" font-size="58" letter-spacing="0.5" fill="#0b1222" >WHAT I DO</text>
</g>
