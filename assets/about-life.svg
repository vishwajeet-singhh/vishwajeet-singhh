<g class="about-a" style="animation-name:about-fadeUp;animation-delay:0.50s"><rect x="462" y="172" width="384" height="152" rx="20" fill="#1b2a4a" fill-opacity=".07" filter="url(#about-soft)"/><rect x="460" y="164" width="388" height="152" rx="20" fill="#ffffff" stroke="url(#about-cardhair)" stroke-width="1.2" /><rect x="460" y="190" width="4" height="100" rx="2" fill="#ff354f"/><rect x="488" y="190" width="48" height="48" rx="14" fill="url(#about-tileR)" stroke="#ff354f" stroke-opacity=".35"/><path fill="none" stroke="#d91a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M522 211a10.5 10.5 0 1 0 .8 6.5"/><path fill="none" stroke="#d91a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M523.5 204v7.5h-7.5"/><text x="820" y="210" class="about-m about-b" font-size="13" fill="#7c869b" text-anchor="end" >02</text><text x="486" y="280" class="about-d" font-size="38" letter-spacing="0.5" fill="#0b1222" >SCRUM MASTER</text><text x="488" y="302" class="about-m" font-size="13.5" fill="#4a5468" >Agile delivery for a ~20-person team</text></g>
